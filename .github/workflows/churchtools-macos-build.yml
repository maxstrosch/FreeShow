name: macOS Build

# This is an unsigned test build. The local electron-builder config disables
# the inherited afterSign notarization hook because no Apple credentials exist.

on:
  push:
    branches:
      - feature/churchtools-cloud-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS (Apple Silicon + Intel)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install node-gyp
        run: npm install --global node-gyp

      - name: Install dependencies
        run: npm ci

      - name: Install dmg-license
        run: npm install --no-save dmg-license

      - name: Compile FreeShow application
        run: npm run build

      - name: Package macOS installers
        run: npx electron-builder --config config/building/electron-builder.local.yaml --mac dmg zip --publish never

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: FreeShow-macOS-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14
